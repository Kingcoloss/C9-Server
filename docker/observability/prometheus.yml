# Scrapes the game-service agents and the Admin Portal on the compose network.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
scrape_configs:
  - job_name: c9-game
    metrics_path: /metrics
    static_configs:
      - targets: ["c9-login:9101", "c9-lobby:9102"]
  - job_name: c9-portal
    metrics_path: /metrics
    static_configs:
      - targets: ["c9-portal:14880"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
